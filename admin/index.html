<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>워크숍 관리</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<style>
  .wrap.wide { max-width: 980px; }
  .test-head .wrap { flex-direction: row; justify-content: space-between; align-items: center; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; min-width: 180px; }
  select.field { width: 100%; border: 1px solid var(--divider); background: #fff; padding: 10px 12px; min-height: 48px; font-size: 16px; border-radius: 0; }
  .sec-title { font-family: var(--serif); font-size: 18px; margin-bottom: 4px; }
  .sid { font-family: var(--serif); font-size: 22px; letter-spacing: 0.02em; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 10px; border: 1px solid var(--divider); color: var(--mid); letter-spacing: 0.04em; }
  .pill.on { background: var(--wood); border-color: var(--wood); color: #fff; }
  .tests { display: grid; gap: 14px; margin-top: 18px; }
  .test { border: 1px solid var(--divider); background: #fff; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px 18px; }
  .test-name { font-weight: 500; font-size: 15px; }
  .url { width: 100%; font-size: 13px; border: 1px solid var(--divider); background: var(--cream); padding: 8px 10px; color: var(--mid); min-height: 38px; }
  .qr { width: 132px; height: 132px; background: #fff; border: 1px solid var(--divider); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr-col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .qr-col .row { gap: 4px; }
  .btn.mini { min-height: 34px; padding: 4px 10px; font-size: 12px; }
  .live-count { font-family: var(--serif); font-size: 18px; margin: 8px 0 20px; }
  .live-count b { font-weight: 600; color: var(--wood); font-size: 26px; }
  .avg-row .bar-val { font-size: 16px; }
  .danger { border-top: 1px solid var(--divider); padding-top: 18px; margin-top: 22px; }
  .btn.warn { background: transparent; color: #8a3b2b; border-color: #d9b8ad; }
  .btn.warn:hover { background: #f8eeea; }
  .msg { font-size: 13px; color: #8a3b2b; min-height: 20px; margin-top: 8px; }
  .ok { color: var(--wood); }
  @media (max-width: 640px) { .test { grid-template-columns: 1fr; } .qr-col { align-items: flex-start; } }

  /* 발표 화면 */
  #present { position: fixed; inset: 0; z-index: 1000; background: var(--warm-white); display: none; flex-direction: column; justify-content: safe center; padding: 5vh 7vw 3vh; overflow: auto; }
  #present.show { display: flex; }
  #present h1 { font-size: clamp(28px, min(4vw, 6.5vh), 64px); margin-bottom: 1vh; font-weight: 400; }
  #present .p-count { font-size: clamp(20px, min(2.6vw, 4.2vh), 42px); color: var(--mid); margin-bottom: 4.5vh; font-family: var(--serif); }
  #present .p-count b { color: var(--wood); font-weight: 600; }
  #present .p-bars { display: grid; gap: 3.2vh; }
  #present .p-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.4vh; }
  #present .p-name { font-size: clamp(22px, min(2.8vw, 4.6vh), 46px); font-weight: 400; font-family: var(--serif); }
  #present .p-val { font-size: clamp(28px, min(3.8vw, 6.4vh), 64px); color: var(--wood); font-weight: 500; font-variant-numeric: tabular-nums; }
  #present .p-val small { font-size: 0.45em; color: var(--light); font-weight: 400; }
  #present .p-track { height: clamp(20px, 4vh, 48px); background: var(--divider); }
  #present .p-track i { display: block; height: 100%; background: var(--wood); transition: width 0.6s ease; }
  #present .p-scale { display: flex; justify-content: space-between; font-size: clamp(12px, 1.2vw, 18px); color: var(--light); margin-top: 0.8vh; }
  #present .p-close { position: absolute; top: 18px; right: 22px; background: none; border: 1px solid var(--divider); color: var(--light); font-size: 13px; padding: 6px 12px; }
  #present .p-close:hover { color: var(--wood); border-color: var(--wood-light); }
</style>
</head>
<body>
<header class="test-head"><div class="wrap wide">
  <span class="test-title">워크숍 관리</span>
  <button class="btn text small" id="logout" hidden>로그아웃</button>
</div></header>

<main><div class="wrap wide" id="app"><div class="closed"><p class="tiny">불러오는 중…</p></div></div></main>

<div id="present" role="dialog" aria-label="발표 화면">
  <button class="p-close" id="pClose">닫기 (ESC)</button>
  <h1>오늘 참여자들의 현재 소진</h1>
  <div class="p-count">응답자 <b id="pN">0</b>명</div>
  <div class="p-bars" id="pBars"></div>
</div>

<script type="module">
import { $, esc, fmt, store } from '../assets/quiz.js';
import * as be from '../assets/backend.js';
import { SCALES, SCALE_KEYS } from '../assets/cbi-data.js';

const app = $('#app');
const TESTS = [
  { flag: 'cbiOpen', path: 'cbi', name: '현재 소진 상태 체크 (CBI)', short: 'cbi' },
  { flag: 'needsOpen', path: 'needs', name: '욕구·가치 우선순위 프로파일', short: 'needs' },
  { flag: 'strengthsOpen', path: 'strengths', name: '24가지 성격강점 프로파일', short: 'strengths' }
];

let sessions = [], current = store.get('ws-admin:current') || '', unSessions = null, unCbi = null, cbiRows = [];
let qrLib = null, renderedFor = '';

if (!be.isConfigured()) {
  app.innerHTML = '<div class="card"><p>Firebase 설정(assets/firebase-config.js)이 아직 입력되지 않았습니다.</p></div>';
} else {
  be.onAdminState(user => user ? enter(user) : loginView());
}

/* ── 로그인 ── */
function loginView(err = '') {
  stopAll();
  $('#logout').hidden = true;
  app.innerHTML = `<div class="card" style="max-width:420px;margin:0 auto">
    <h2>강사 로그인</h2>
    <form id="lf" autocomplete="on">
      <label class="field-label" for="em">이메일</label>
      <input class="field" id="em" type="email" autocomplete="username" required>
      <label class="field-label" for="pw">비밀번호</label>
      <input class="field" id="pw" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="btn block" type="submit">로그인</button></div>
      <p class="msg" id="lm">${esc(err)}</p>
    </form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    $('#lm').textContent = '';
    try { await be.adminSignIn($('#em').value.trim(), $('#pw').value); }
    catch { $('#lm').textContent = '이메일 또는 비밀번호를 확인해 주세요.'; }
  };
}

$('#logout').onclick = () => be.adminSignOut();

/* ── 관리 화면 ── */
async function enter(user) {
  $('#logout').hidden = false;
  app.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div class="grow">
          <label class="field-label" for="sel" style="margin-top:0">회차 선택</label>
          <select class="field" id="sel"></select>
        </div>
      </div>
      <form class="row" id="nf" style="margin-top:14px;align-items:flex-end">
        <div class="grow">
          <label class="field-label" for="nid">새 회차 만들기</label>
          <input class="field" id="nid" placeholder="예: AMC-2026-11-12-A" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn" type="submit">만들기</button>
      </form>
      <p class="msg" id="nm"></p>
      <p class="tiny">영문·숫자·하이픈(-) 3~40자. 회차 ID는 참가자 주소와 QR에 그대로 들어가므로 병원명 약자·날짜 정도만 쓰고 개인 정보는 넣지 마세요.</p>
    </div>
    <div id="sess"></div>`;

  $('#nf').onsubmit = async e => {
    e.preventDefault();
    const id = $('#nid').value.trim();
    const m = $('#nm'); m.textContent = ''; m.classList.remove('ok');
    if (!be.SESSION_RE.test(id)) { m.textContent = '영문·숫자·하이픈(-)만 3~40자로 입력해 주세요.'; return; }
    try { await be.createSession(id); select(id); $('#nid').value = ''; m.classList.add('ok'); m.textContent = `회차 ${id}를 만들었습니다. 검사는 모두 닫힌 상태로 시작합니다.`; }
    catch (err) { m.textContent = err.message === 'exists' ? '이미 있는 회차 ID입니다.' : '만들지 못했습니다. 권한이나 연결을 확인해 주세요.'; }
  };
  $('#sel').onchange = e => select(e.target.value);

  unSessions = await be.watchSessions(list => {
    sessions = list;
    if (current && !sessions.some(s => s.id === current)) current = '';
    if (!current && sessions.length) current = sessions[0].id;
    renderSelect();
    renderSession();
  }, err => {
    app.innerHTML = `<div class="card"><p>이 계정(${esc(user.email)})에는 관리자 권한이 없습니다.</p></div>`;
  });
}

function renderSelect() {
  const sel = $('#sel'); if (!sel) return;
  sel.innerHTML = sessions.length
    ? sessions.map(s => `<option value="${esc(s.id)}" ${s.id === current ? 'selected' : ''}>${esc(s.id)}${s.ended ? ' (종료됨)' : ''}</option>`).join('')
    : '<option value="">아직 만든 회차가 없습니다</option>';
}

function select(id) {
  current = id; store.set('ws-admin:current', id);
  renderSelect(); renderSession();
}

function urlFor(t, sid) {
  return new URL(`../${t.path}/?session=${encodeURIComponent(sid)}`, location.href).href;
}

function renderSession() {
  const box = $('#sess'); if (!box) return;
  const s = sessions.find(x => x.id === current);
  if (!s) { box.innerHTML = ''; stopCbi(); renderedFor = ''; return; }

  // 같은 회차면 상태 표시만 갱신 (QR·입력값 유지)
  if (renderedFor === s.id) { updateFlags(s); return; }
  renderedFor = s.id;

  box.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><div class="eyebrow" style="margin-bottom:2px">현재 회차</div><div class="sid">${esc(s.id)}</div></div>
        <span class="pill" id="endedPill" hidden>종료됨</span>
      </div>
      <div class="tests">
        ${TESTS.map(t => `<div class="test" data-t="${t.short}">
          <div>
            <div class="row" style="justify-content:space-between;margin-bottom:10px">
              <span class="test-name">${esc(t.name)}</span>
              <span class="pill" data-pill="${t.flag}"></span>
            </div>
            <div class="row" style="margin-bottom:10px">
              <button class="btn small" data-toggle="${t.flag}"></button>
            </div>
            <input class="url" readonly value="${esc(urlFor(t, s.id))}" aria-label="${esc(t.name)} 참가자 주소">
            <div class="row" style="margin-top:8px">
              <button class="btn line mini" data-copy="${t.short}">주소 복사</button>
              <span class="tiny" data-copied="${t.short}"></span>
            </div>
          </div>
          <div class="qr-col">
            <div class="qr" data-qr="${t.short}"></div>
            <div class="row">
              <button class="btn line mini" data-png="${t.short}">PNG</button>
              <button class="btn line mini" data-svg="${t.short}">SVG</button>
            </div>
          </div>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="sec-title">오늘 참여자들의 현재 소진</div>
        <button class="btn small" id="presentBtn">발표 화면</button>
      </div>
      <div class="live-count">응답자 <b id="cN">0</b>명</div>
      <div class="bars avg-row" id="cBars"></div>
      <p class="tiny" style="margin-top:16px">현재 회차에서 응답을 완료한 참여자들의 단순 평균입니다.</p>
    </div>

    <div class="card">
      <div class="sec-title">회차 정리</div>
      <div class="actions" style="margin-top:12px">
        <button class="btn line small" id="clearBtn">CBI 데이터 초기화</button>
        <button class="btn small" id="endBtn">회차 종료</button>
        <button class="btn warn small" id="delBtn">회차 데이터 삭제</button>
      </div>
      <p class="tiny" style="margin-top:12px">회차 종료: 세 검사를 모두 닫고 CBI 제출을 막습니다. 데이터는 남습니다.<br>회차 데이터 삭제: 이 회차의 CBI 익명 결과와 회차 기록을 모두 지웁니다. 되돌릴 수 없습니다.</p>
      <p class="msg" id="am"></p>
    </div>`;

  updateFlags(s);

  box.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const flag = b.dataset.toggle;
    const cur = sessions.find(x => x.id === current);
    b.disabled = true;
    try {
      const next = !cur[flag];
      await be.updateSession(current, next ? { [flag]: true, ended: false } : { [flag]: false });
    } catch { $('#am').textContent = '상태를 바꾸지 못했습니다.'; }
    b.disabled = false;
  });
  TESTS.forEach(t => {
    const url = urlFor(t, s.id);
    box.querySelector(`[data-copy="${t.short}"]`).onclick = () => copy(url, box.querySelector(`[data-copied="${t.short}"]`));
    drawQr(url, box.querySelector(`[data-qr="${t.short}"]`));
    box.querySelector(`[data-png="${t.short}"]`).onclick = () => downloadPng(url, `${s.id}-${t.short}-QR.png`);
    box.querySelector(`[data-svg="${t.short}"]`).onclick = () => downloadSvg(url, `${s.id}-${t.short}-QR.svg`);
  });

  $('#presentBtn').onclick = openPresent;
  $('#clearBtn').onclick = async () => {
    if (!confirm(`회차 ${current}의 CBI 응답 결과를 모두 지우고 평균을 초기화할까요?`)) return;
    try { const n = await be.clearCbi(current); msg(`CBI 결과 ${n}건을 삭제했습니다.`, true); } catch { msg('삭제하지 못했습니다.'); }
  };
  $('#endBtn').onclick = async () => {
    if (!confirm(`회차 ${current}를 종료할까요?\n세 검사가 모두 닫히고 CBI 결과 제출이 중단됩니다.`)) return;
    try { await be.updateSession(current, { cbiOpen: false, needsOpen: false, strengthsOpen: false, ended: true }); msg('회차를 종료했습니다. 세 검사가 모두 닫혔습니다.', true); } catch { msg('종료하지 못했습니다.'); }
  };
  $('#delBtn').onclick = async () => {
    if (!confirm(`회차 ${current}의 CBI 익명 결과와 회차 기록을 모두 삭제할까요?\n삭제하면 되돌릴 수 없습니다.`)) return;
    const id = current;
    try { stopCbi(); await be.deleteSession(id); current = ''; store.del('ws-admin:current'); renderedFor = ''; } catch { msg('삭제하지 못했습니다.'); }
  };

  startCbi(s.id);
}

function msg(t, ok = false) { const m = $('#am'); if (!m) return; m.textContent = t; m.classList.toggle('ok', ok); }

function updateFlags(s) {
  TESTS.forEach(t => {
    const on = !!s[t.flag];
    const pill = document.querySelector(`[data-pill="${t.flag}"]`);
    const btn = document.querySelector(`[data-toggle="${t.flag}"]`);
    if (pill) { pill.textContent = on ? '열림' : '닫힘'; pill.classList.toggle('on', on); }
    if (btn) { btn.textContent = on ? '닫기' : '열기'; btn.classList.toggle('line', on); }
  });
  const ep = $('#endedPill'); if (ep) ep.hidden = !s.ended;
}

/* ── CBI 실시간 평균 ── */
function averages(rows) {
  const out = {};
  for (const k of SCALE_KEYS) out[k] = rows.length ? rows.reduce((a, r) => a + r[k], 0) / rows.length : null;
  return out;
}
async function startCbi(sid) {
  stopCbi();
  cbiRows = []; paintCbi();
  unCbi = await be.watchCbi(sid, rows => { cbiRows = rows; paintCbi(); }, () => msg('CBI 집계를 불러오지 못했습니다.'));
}
function stopCbi() { if (unCbi) { unCbi(); unCbi = null; } }
function stopAll() { stopCbi(); if (unSessions) { unSessions(); unSessions = null; } renderedFor = ''; }

function paintCbi() {
  const a = averages(cbiRows), n = cbiRows.length;
  const cN = $('#cN'); if (cN) cN.textContent = n;
  const cBars = $('#cBars');
  if (cBars) cBars.innerHTML = SCALE_KEYS.map(k => `<div class="bar-row">
    <div class="bar-head"><span class="bar-name">${SCALES[k].name}</span><span class="bar-val">평균 ${a[k] === null ? '–' : fmt(a[k], 1)}</span></div>
    <div class="track"><i style="width:${a[k] ?? 0}%;background:var(--wood)"></i></div></div>`).join('');
  $('#pN').textContent = n;
  $('#pBars').innerHTML = SCALE_KEYS.map(k => `<div>
    <div class="p-head"><span class="p-name">${SCALES[k].name}</span><span class="p-val">${a[k] === null ? '–' : fmt(a[k], 1)} <small>/ 100</small></span></div>
    <div class="p-track"><i style="width:${a[k] ?? 0}%"></i></div>
    <div class="p-scale"><span>0</span><span>100</span></div></div>`).join('');
}

/* ── 발표 화면 ── */
function openPresent() {
  const p = $('#present');
  p.classList.add('show');
  document.body.style.overflow = 'hidden';
  if (p.requestFullscreen) p.requestFullscreen().catch(() => {});
}
function closePresent() {
  $('#present').classList.remove('show');
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
$('#pClose').onclick = closePresent;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#present').classList.contains('show')) closePresent(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && $('#present').classList.contains('show')) closePresent(); });

/* ── 주소 복사 / QR ── */
async function copy(text, out) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
  }
  out.textContent = '복사했습니다'; setTimeout(() => out.textContent = '', 1800);
}

async function qrMatrix(text) {
  if (!qrLib) qrLib = (await import('../assets/vendor/qrcode.mjs')).default;
  const qr = qrLib(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount();
  return { n, dark: (r, c) => qr.isDark(r, c) };
}
async function svgFor(text) {
  const { n, dark } = await qrMatrix(text);
  const m = 4, size = n + m * 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (dark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
async function drawQr(text, el) {
  try { el.innerHTML = await svgFor(text); } catch { el.innerHTML = '<p class="tiny" style="padding:8px">QR을 불러오지 못했습니다</p>'; }
}
function save(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function downloadSvg(text, name) { save(new Blob([await svgFor(text)], { type: 'image/svg+xml' }), name); }
async function downloadPng(text, name) {
  const { n, dark } = await qrMatrix(text);
  const m = 4, scale = Math.max(8, Math.floor(1200 / (n + m * 2))), px = (n + m * 2) * scale;
  const cv = document.createElement('canvas'); cv.width = cv.height = px;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, px, px); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (dark(r, c)) g.fillRect((c + m) * scale, (r + m) * scale, scale, scale);
  cv.toBlob(b => save(b, name), 'image/png');
}
</script>
</body>
</html>
